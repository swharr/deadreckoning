name: Data Pipeline

# DATA ONLY — scrapes, processes, and commits data.
# After merging the data PR, this workflow dispatches deploy.yml explicitly
# (GITHUB_TOKEN merges don't trigger on:push workflows).
#
# ARCHIVE MODE (2026-04-30): The Utah Lt. Governor's Elections Division
# certified that the petition did not qualify. The site is now archived and
# the daily cron has been disabled. The workflow can still be triggered
# manually via workflow_dispatch or by dropping a file in data/manual/ if a
# late correction or backfill is ever needed.

on:
  workflow_dispatch:             # manual trigger from GitHub UI or CLI
  push:
    branches:
      - main
    paths:
      - 'data/manual/**'        # manual xlsx drop → always run full pipeline

jobs:
  fetch-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: pip install -r requirements.txt

      - name: Scrape LG site (manual file wins automatically if present)
        id: scrape
        run: python scripts/scraper.py

      - name: Check whether new data arrived
        id: check
        run: |
          if [ -f data/.scraper_changed ]; then
            echo "data_changed=true"  >> $GITHUB_OUTPUT
            echo "✅ New data detected — proceeding with pipeline."
          else
            echo "data_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No change in the Data — will check again next scheduled run."
          fi

      - name: Rebuild history and process data
        if: steps.check.outputs.data_changed == 'true'
        run: |
          python scripts/replay.py
          python scripts/process.py

      - name: Run Python regression tests
        if: steps.check.outputs.data_changed == 'true'
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Install Node dependencies
        if: steps.check.outputs.data_changed == 'true'
        run: npm ci

      - name: Run quality checks
        if: steps.check.outputs.data_changed == 'true'
        run: npm run check

      - name: Create PR with updated data
        if: steps.check.outputs.data_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "t8rsk8s Data Robot"
          git config user.email "bot@t8rsk8s.io"
          git add data/snapshots/*.xlsx data/history.json data/removals.json public/data.json
          if git diff --staged --quiet; then
            echo "No staged changes — skipping PR"
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          BRANCH="data/update-$(date -u +%Y-%m-%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git fetch origin main
          git rebase origin/main -X theirs
          git push origin "$BRANCH"
          gh pr create \
            --title "data: update $(date -u +%Y-%m-%d)" \
            --body "Automated data update from t8rsk8s Data Robot." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Trigger deploy
        if: steps.check.outputs.data_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching Build and Deploy workflow..."
          gh workflow run "Build and Deploy"

      - name: Summarize pipeline result
        if: always()
        run: |
          {
            echo "## Data pipeline"
            echo
            echo "- Job status: ${{ job.status }}"
            echo "- Data changed: ${{ steps.check.outputs.data_changed || 'unknown' }}"
            echo "- Deploy behavior: dispatch to Build and Deploy workflow after merge"
          } >> "$GITHUB_STEP_SUMMARY"
